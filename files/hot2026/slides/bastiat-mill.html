<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bastiat and Mill: Pure Versus Eclectic</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#FBFAF7;--green:#154734;--gold:#FFB81C;--golddeep:#C98F00;--ink:#1A1A1A;--warm:#6B7280;--brick:#9B2C2C;--pale:#D8D4CB;--earth:#8C7B6B;--mist:#EDE9DE}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--cream)}
  body{cursor:pointer;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  svg text{font-family:"Fira Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  svg text:not([fill]){fill:var(--ink)}
  svg rect.bar{transition:x .6s cubic-bezier(.2,.8,.2,1),width .6s cubic-bezier(.2,.8,.2,1),y .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
  .fade{transition:opacity .45s ease}
  #help{position:fixed;left:16px;bottom:12px;font:13px "Fira Sans",sans-serif;color:var(--pale)}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#FBFAF7"/>
  <text id="title" x="80" y="92" font-size="50" font-weight="700" fill="#154734" class="fade"></text>
  <rect x="80" y="114" width="146" height="3" fill="#FFB81C"/>
  <text id="sub" x="80" y="150" font-size="24" fill="#6B7280" class="fade"></text>
  <g id="body"></g>
  <text id="counter" x="1565" y="882" font-size="18" fill="#D8D4CB" text-anchor="end"></text>
</svg>
<div id="help">→ or click: next · ← or shift-click: back · End fills the scene · N next scene · F full screen · R restart</div>
<script>
(() => {
const NS='http://www.w3.org/2000/svg';
const C={green:'#154734',gold:'#FFB81C',golddeep:'#C98F00',ink:'#1A1A1A',warm:'#6B7280',brick:'#9B2C2C',pale:'#D8D4CB',earth:'#8C7B6B',mist:'#EDE9DE',cream:'#FBFAF7'};
const $=id=>document.getElementById(id);
const el=(tag,attrs,parent,text)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;(parent||$('body')).appendChild(e);return e;};
const T=(g,x,y,s,a)=>el('text',Object.assign({x,y,'font-size':24,fill:C.ink},a||{}),g,s);
const fmt=(v,d)=>v.toFixed(d==null?2:d);
const pct=r=>Math.round(r*100)+'%';

// ---------------- text helpers ----------------
function note(g,text,y){const words=text.split(' ');let line='',lines=[];
  for(const wd of words){if((line+' '+wd).length>120){lines.push(line);line=wd;}else line=line?line+' '+wd:wd;}
  lines.push(line);lines.forEach((l,i)=>el('text',{x:80,y:(y||805)+i*30,'font-size':23,fill:C.ink},g,l));}
function bullets(g,lines,y0,size,nshow){const fs=size||33,lh=Math.round(fs*1.3),gap=Math.round(fs*1.1),maxc=86;
  // a line starting with '>' is a sub-bullet: indented, smaller, en dash
  const items=lines.map(l=>l.startsWith('>')?{sub:true,t:l.slice(1).trim()}:{sub:false,t:l});
  const wrapped=items.map(it=>{const mc=it.sub?maxc+8:maxc;const words=it.t.split(' ');let line='',rows=[];for(const wd of words){if((line+' '+wd).length>mc){rows.push(line);line=wd;}else line=line?line+' '+wd:wd;}rows.push(line);return rows;});
  const lhOf=it=>it.sub?Math.round((fs-5)*1.3):lh;
  const gapAfter=i=>(items[i+1]&&items[i+1].sub)?Math.round(gap*0.45):gap;
  const H=wrapped.reduce((a,r,i)=>a+r.length*lhOf(items[i])+(i<wrapped.length-1?gapAfter(i):0),0);
  let y=y0||Math.max(200,200+(640-H)/2)+fs; // vertically center the block in y=200..840
  wrapped.forEach((rows,i)=>{const it=items[i];const f=it.sub?fs-5:fs;const op=(nshow!=null&&i>=nshow)?0:1;
    el('text',{x:it.sub?150:90,y:y,'font-size':f,fill:it.sub?C.warm:C.gold,'font-weight':700,opacity:op},g,it.sub?'–':'•');
    rows.forEach((r,k)=>el('text',{x:it.sub?185:130,y:y+k*lhOf(it),'font-size':f,fill:it.sub?C.warm:C.ink,opacity:op,class:'fade'},g,r));y+=rows.length*lhOf(it)+gapAfter(i);});}
// animated rect with memory across scenes
let bars={};const drawn={};
function abar(g,key,x,y,w,h,fill,o){o=o||{};const rc=el('rect',Object.assign({class:'bar',fill,stroke:'#fff','stroke-width':1.5},o.attrs||{}),g);
  const prev=bars[key];if(prev){rc.setAttribute('x',prev.x);rc.setAttribute('y',prev.y);rc.setAttribute('width',prev.w);rc.setAttribute('height',prev.h);}
  else{rc.setAttribute('x',x);rc.setAttribute('y',y+h/2);rc.setAttribute('width',w);rc.setAttribute('height',0);}
  requestAnimationFrame(()=>requestAnimationFrame(()=>{rc.setAttribute('x',x);rc.setAttribute('y',y);rc.setAttribute('width',w);rc.setAttribute('height',h);}));
  bars[key]={x,y,w,h};drawn[key]=1;
  if(o.label!=null){const t=el('text',{x:x+w/2,y:y+h/2+(o.fs||22)/3,'font-size':o.fs||22,'font-weight':700,'text-anchor':'middle',fill:o.lc||'#fff',class:'fade',opacity:prev?1:0},g,o.label);if(!prev)setTimeout(()=>t.setAttribute('opacity',1),350);}
  return rc;}
function sweep(){for(const k in bars)if(!drawn[k])delete bars[k];for(const k in drawn)delete drawn[k];}

// ---------------- generic staged table ----------------
function tbl(g,o){ // {x,y,heads,rows,colW,show,fresh,fs,rowH,color(i,j),bold(i,j)}
  const fs=o.fs||22,rowH=o.rowH||48;let cx=o.x;const xs=[];
  for(let j=0;j<o.heads.length;j++){xs.push(cx+o.colW[j]/2);cx+=o.colW[j];}
  o.heads.forEach((h,j)=>{const on=!o.show||o.show[j];const lines=String(h).split('\n');lines.forEach((ln,q)=>el('text',{x:xs[j],y:o.y-(lines.length-1-q)*20,'font-size':17,'text-anchor':'middle',fill:on?C.warm:C.pale},g,ln));});
  el('line',{x1:o.x,y1:o.y+12,x2:cx,y2:o.y+12,stroke:C.pale,'stroke-width':2},g);
  o.rows.forEach((row,i)=>{const y=o.y+rowH*(i+1)+10;
    if(o.hl&&o.hl.includes(i))el('rect',{x:o.x-8,y:y-32,width:cx-o.x+16,height:rowH,fill:'#FFF3CF',rx:6},g);
    row.forEach((v,j)=>{if(o.show&&!o.show[j])return;const fresh=o.fresh===j;
      const t=el('text',{x:xs[j],y,'font-size':fs,'text-anchor':'middle',fill:(o.color&&o.color(i,j))||C.ink,'font-weight':(o.bold&&o.bold(i,j))?700:400,class:'fade',opacity:fresh?0:1},g,v);
      if(fresh)setTimeout(()=>t.setAttribute('opacity',1),30);});});
  return {right:cx,bottom:o.y+rowH*(o.rows.length+1)+10};}

// ---------------- model 1: hunters ----------------
function hunt(g,k,bv,dr,factor,o){ // bv beaver days, dr deer days, factor = productivity change in deer hunting at stage 2
  const unit=300,X=420;const deer=k>=2?dr/factor:dr;
  const row=(key,y,name,days,fill)=>{T(g,110,y+40,name,{'font-size':28,'font-weight':500});
    abar(g,key,X,y,days*unit-6,60,fill,{label:(+days.toFixed(2))+(days===1?' day':' days'),lc:'#fff'});};
  row('bv',230,'One beaver',bv,C.earth);row('dr',330,'One deer',deer,C.gold);
  if(k>=1){const ratio=bv/deer;T(g,110,500,'1 beaver  =  '+(+ratio.toFixed(2))+' deer',{'font-size':48,'font-weight':700,fill:C.green});
    T(g,110,548,'The exchange ratio is the ratio of the labor it takes to get each one.',{fill:C.warm});}
  if(k>=2){T(g,110,630,(o&&o.cause)||'The hunters learn to mask their scent. No new tool, no one else\'s labor: a skill.',{'font-size':26});T(g,110,672,'Deer hunting gets '+factor+'× as productive. A deer now takes '+(+deer.toFixed(2))+(deer===1?' day.':' days.'),{'font-size':26,fill:C.green,'font-weight':500});}
  if(k>=3)note(g,o&&o.note||'Hunters are richer: '+factor+'× the deer for the same work. And each deer is worth less, because less labor is in it. Riches rose, value fell. “Every diminution must lower it.” (HL p. 99)',735);
  sweep();}

// ---------------- model 1b: the stockings stack ----------------
function stack(g,k,layers){const X=200,W=260,B=680,px=44;let y=B,sum=0;
  layers.forEach((L,i)=>{if(i>k)return;const h=L.h*px;y-=h;sum+=L.h;abar(g,'st'+i,X,y,W,h,L.c,{label:L.h+' h',fs:20,lc:L.dark?C.ink:'#fff'});
    T(g,X+W+24,y+h/2+8,L.name,{'font-size':24,fill:i===k?C.ink:C.warm,'font-weight':i===k?500:400});});
  el('line',{x1:X-20,y1:B,x2:X+W+20,y2:B,stroke:C.ink,'stroke-width':2},g);
  T(g,X+W/2,B+34,'one pair of stockings',{'text-anchor':'middle',fill:C.warm,'font-size':20});
  T(g,1000,300,'labor embodied so far',{fill:C.warm,'font-size':20});T(g,1000,370,sum+' hours',{'font-size':54,'font-weight':700,fill:C.green});
  if(k>=layers.length-1){T(g,1000,450,'The stockings exchange for anything else',{'font-size':24});T(g,1000,486,'that took '+sum+' hours, the loom\'s share included.',{'font-size':24});
    note(g,'“The aggregate sum of these various kinds of labour determines the quantity of other things for which these stockings will exchange.” A loom is “so much partly produced cloth.” (HL p. 102)',770);}
  sweep();}

// ---------------- model 2: the day's product in hours ----------------
function split(g,k,L,Lw,o){const X=110,W=1380,Y=300,H=130,px=W/L;const Lp=L-Lw;
  T(g,X,Y-22,'the day\'s product: '+o.n+' workers × '+(L/o.n)+' hours  =  '+L+' hours of value',{fill:C.warm,'font-size':22});
  el('rect',{x:X,y:Y,width:W,height:H,fill:'none',stroke:C.ink,'stroke-width':2},g);
  if(k>=1){abar(g,'w',X,Y,Lw*px,H,C.earth,{label:'wages '+Lw,fs:30});
    T(g,X,Y+H+40,'the necessaries of '+o.n+' workers took '+Lw+' hours to make: '+o.n+' baskets × '+(Lw/o.n)+' hours each',{'font-size':22});}
  if(k>=2){abar(g,'p',X+Lw*px,Y,Lp*px,H,C.green,{label:'profit '+Lp,fs:30});
    T(g,X,Y+H+78,'what is left after the necessaries are replaced goes to the capitalist: '+Lp+' hours',{'font-size':22});}
  if(k>=3){T(g,X,560,'r  =  '+Lp+' ÷ '+Lw+'  =  '+fmt(Lp/Lw),{'font-size':40,'font-weight':700,fill:C.green});
    T(g,X,600,'r is the rate of profit: profit divided by the wages the capitalist advanced. He laid out '+Lw+' hours of goods and got back '+L+'. The same r as the corn model.',{'font-size':21,fill:C.ink});}
  if(o.echo&&(k>=4||o.opener))T(g,X,o.opener?580:640,o.echo,{fill:C.warm,'font-size':22});
  if(k>=(o.echo?5:4)&&o.note)note(g,o.note,735);
  sweep();}

// ---------------- model 3: time-dated labor, two goods ----------------
function timing(g,k,A,Bn,Bl,rs,o){ // steps 0-3 build the picture at rs[0]; later steps change r
  const INTRO=4;const ri=k<INTRO?0:Math.min(k-INTRO,rs.length-1);const r=rs[ri],w=o.w||1,X=110,unit=22,LINE=X+520;
  const yr=(x,y,h,fill,key,lab)=>abar(g,key,x,y,h*unit,56,fill,{label:lab,fs:20});
  T(g,X,235,'last year',{fill:C.warm,'font-size':20});T(g,X+560,235,'this year',{fill:C.warm,'font-size':20});
  el('line',{x1:LINE,y1:220,x2:LINE,y2:420,stroke:C.pale,'stroke-width':2,'stroke-dasharray':'6 5'},g);
  T(g,X+820,275,'Good A',{'font-size':26,'font-weight':500});yr(X+560,250,A,C.earth,'A0',A+' hours');
  if(k>=1){T(g,X+820,355,'Good B',{'font-size':26,'font-weight':500});yr(LINE-12-Bl*unit,330,Bl,C.gold,'B1',Bl+' hours');yr(X+560,330,Bn,C.earth,'B0',Bn+' hours');}
  if(k>=2)T(g,X,470,'r = '+pct(r),{'font-size':44,'font-weight':700,fill:C.green});
  const pA=w*(1+r)*A, pB=w*(1+r)*(Bn+Bl*(1+r));
  const f=(1+r).toFixed(2);
  const rows=[['A',A,`${w} × ${f} × ${A}`,fmt(pA)],['B',Bn+Bl,`${w} × ${f} × (${Bn} + ${Bl} × ${f})`,fmt(pB)]];
  if(k>=2)tbl(g,{x:X+300,y:470,heads:['good','labor (hours)','price = w(1+r) × [now + last year × (1+r)]','price'],colW:[90,150,620,140],rows:k>=3?rows:rows.slice(0,1),fs:24,rowH:52,color:(i,j)=>j===3?C.green:C.ink,bold:(i,j)=>j===3});
  if(k>=INTRO){T(g,X+300,650,'price of B ÷ price of A  =  '+fmt(pB/pA),{'font-size':34,'font-weight':700,fill:ri===0?C.green:C.brick});
    T(g,X+300,690,'labor in B ÷ labor in A  =  '+fmt((Bn+Bl)/A),{'font-size':24,fill:C.warm});}
  const intro=['Good A: ten hours of labor, all of it this year.','Good B: the same ten hours, but five of them were done last year, on a tool that is used up now.','Start with no charge for waiting: r = 0. Price A.','Price B the same way. Last year\'s hours get multiplied by (1 + r) once more, which at r = 0 changes nothing.'];
  if(k<INTRO)note(g,intro[k],745);else if(o.notes&&o.notes[ri])note(g,o.notes[ri],745);
  sweep();}

// ---------------- compounding stair ----------------
function stair(g,k){const vals=[100,110,121,133.10,146.41],adds=['','+ 10','+ 11','+ 12.10','+ 13.31'],labs=['wage paid, year 1','end of year 1','end of year 2','end of year 3','end of year 4: sold'];
  const X=140,B=700,px=3.4,bw=200,gap=70;
  vals.forEach((v,i)=>{if(i>k)return;const h=v*px,x=X+i*(bw+gap);abar(g,'sr'+i,x,B-h,bw,h,i===0?C.earth:C.green,{label:'$'+fmt(v),fs:26});
    T(g,x+bw/2,B+32,labs[i],{'text-anchor':'middle','font-size':18,fill:C.warm});if(i>0)T(g,x+bw/2,B-h-14,adds[i],{'text-anchor':'middle','font-size':22,fill:C.golddeep,'font-weight':700});});
  if(k>=4)note(g,'$100 of wages paid four years before the sale must be worth $146.41 in the price: $100 to repay the wage and $46.41 of profit for having $100 tied up for four years at 10 percent. Two years tied up would add only $21. (HL pp. 107–108)',765);
  sweep();}

// ---------------- Figure 5.7: x and y as time-dated labor ----------------
function fig57(g,k){const X=200,unit=0.85,bw=130,gap=60,B0=390,B1=700;
  const yrs=['4 years ago','3 years ago','2 years ago','last year','this year'];
  yrs.forEach((s,i)=>T(g,X+i*(bw+gap)+bw/2,738,s,{'text-anchor':'middle','font-size':18,fill:C.warm}));
  const good=(key,base,labs,name,fill)=>{T(g,X-120,base-40,name,{'font-size':30,'font-weight':700,fill:C.green});
    labs.forEach((h,i)=>{if(h==null)return;abar(g,key+i,X+i*(bw+gap),base-h*unit,bw,h*unit,fill,{label:h,fs:22});});};
  good('x',B0,[75,75,75,75,100],'x',C.earth);
  if(k>=1)good('y',B1,[null,null,50,50,300],'y',C.gold);
  T(g,1130,300,'x: 400 hours over five years',{'font-size':24});T(g,1130,336,'100 now, 75 in each of four past years',{'font-size':20,fill:C.warm});
  if(k>=1){T(g,1130,560,'y: 400 hours over three years',{'font-size':24});T(g,1130,596,'300 now, 50 in each of two past years',{'font-size':20,fill:C.warm});
    note(g,'Same labor in each, 400 hours per 100 units. The difference is only when the labor was done. x has more past labor and a longer wait, which Ricardo would call more fixed capital, more durable capital, or slower turnover. HL p. 106: all three are the same thing. (Figure 5.7, p. 109)',775);}
  sweep();}

// ---------------- Tables 5.1 and 5.2 ----------------
function table5(g,k,o){const show=[true,true,k>=1,k>=2,k>=3,k>=4];
  const heads=['','A\nlabor cost\n(now × w)','B\nmachinery\n(past labor, compounded)','C\nprofit\nr × (A + B)','D\ntotal\nA + B + C','E\nprice per unit\nD ÷ 100'];
  const t=tbl(g,{x:120,y:300,heads,rows:o.rows,colW:[120,220,300,240,240,240],show,fresh:k,fs:28,rowH:70,color:(i,j)=>j===5?C.green:C.ink,bold:(i,j)=>j===5});
  T(g,120,230,'wage w = $'+o.w+'   ·   profit rate r = '+o.r+'   ·   400 hours in each good',{'font-size':24,fill:C.warm});
  if(k>=4){T(g,120,560,'price of x ÷ price of y  =  '+o.ratio,{'font-size':40,'font-weight':700,fill:C.green});if(o.extra)T(g,120,610,o.extra,{'font-size':24,fill:C.brick});}
  if(k>=4&&o.note)note(g,o.note,735);}


// ---------------- scenes ----------------
const S=[];
const txt=(title,sub,lines,extra)=>S.push({title,sub,stages:lines.length,draw:(g,k)=>{bullets(g,lines,null,null,k+1);if(extra)extra(g);}});
const scene=(title,sub,n,draw)=>S.push({title,sub,stages:n,draw});

function cols2(g,k,o){const wrap=(t,mc)=>{const w=t.split(' ');let l='',out=[];for(const x of w){if((l+' '+x).length>mc){out.push(l);l=x;}else l=l?l+' '+x:x;}out.push(l);return out;};
  const XL=o.xl||110,XM=o.xm||560,XR=o.xr||880,fs=o.fs||22,lh=Math.round(fs*1.3);
  T(g,XM,232,o.hl,{'font-size':18,fill:C.warm});T(g,XR,232,o.hr,{'font-size':18,fill:C.warm});
  el('line',{x1:XL-10,y1:246,x2:1520,y2:246,stroke:C.pale,'stroke-width':2},g);
  let y=290;o.rows.slice(0,Math.min(k+1,o.rows.length)).forEach(([lab,a,b])=>{const la=wrap(a,o.mcl||32),lb=wrap(b,o.mcr||50);const n=Math.max(la.length,lb.length);
    T(g,XL,y,lab,{'font-size':fs-2,'font-weight':700,fill:C.ink});la.forEach((ln,q)=>T(g,XM,y+q*lh,ln,{'font-size':fs,fill:C.brick}));lb.forEach((ln,q)=>T(g,XR,y+q*lh,ln,{'font-size':fs,fill:C.green}));y+=n*lh+16;});
  el('line',{x1:XR-30,y1:252,x2:XR-30,y2:Math.max(260,y-24),stroke:C.pale,'stroke-width':2},g);return y;}

function rbul(g,lines,x,y,fs,mc,nshow){const wrap=(t,m)=>{const w=t.split(' ');let l='',out=[];for(const z of w){if((l+' '+z).length>m){out.push(l);l=z;}else l=l?l+' '+z:z;}out.push(l);return out;};
  lines.forEach((t0,i)=>{if(nshow!=null&&i>=nshow)return;const sub=t0.startsWith('>');const t=sub?t0.slice(1).trim():t0;const f=sub?fs-4:fs,lh=Math.round(f*1.3);const rows=wrap(t,sub?mc+6:mc);const xx=sub?x+34:x;
    el('text',{x:xx-26,y,'font-size':f,fill:sub?C.warm:C.gold,'font-weight':700},g,sub?'–':'•');rows.forEach((r,q)=>el('text',{x:xx,y:y+q*lh,'font-size':f,fill:sub?C.warm:C.ink,class:'fade'},g,r));
    const nextSub=lines[i+1]&&lines[i+1].startsWith('>');y+=rows.length*lh+Math.round(f*(nextSub?0.4:0.9));});}


// ---------------- flowchart helper ----------------
function flow(g,o){const N={};o.nodes.forEach((n,i)=>{N[n.id]=n;if(o.showN!=null&&i>=o.showN)return;el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:10,fill:n.fill||C.mist,stroke:n.stroke||'none','stroke-width':2},g);
    const lines=String(n.t).split('\n');const top=n.sub?n.y+30:n.y+n.h/2+8-(lines.length-1)*13;lines.forEach((ln,q)=>T(g,n.x+n.w/2,top+q*26,ln,{'text-anchor':'middle','font-size':n.fs||21,'font-weight':700,fill:n.fg||C.ink}));
    if(n.sub){n.sub.split('\n').forEach((ln,q)=>T(g,n.x+n.w/2,n.y+56+q*20,ln,{'text-anchor':'middle','font-size':16,fill:n.fg?n.fg:C.warm}));}});
  o.edges.forEach((e,i)=>{if(o.showE!=null&&i>=o.showE)return;const a=N[e[0]],b=N[e[1]];if(!a||!b)return;const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
    const clip=(n,cx,cy,dx,dy)=>{const tx=dx!==0?(n.w/2)/Math.abs(dx):1e9,ty=dy!==0?(n.h/2)/Math.abs(dy):1e9;const t=Math.min(tx,ty);return [cx+dx*t,cy+dy*t];};
    const dx=bx-ax,dy=by-ay;const [x1,y1]=clip(a,ax,ay,dx,dy);const [x2,y2]=clip(b,bx,by,-dx,-dy);
    const L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L;const ex=x2-ux*10,ey=y2-uy*10;const col=e[3]||C.warm;

// 2 1848 and 1850
txt('Both men wrote against the French socialists','HL pp. 174–176',[
 'Socialist ideas spread fastest in France in the 1830s and 1840s: Saint-Simon\'s planners, Fourier\'s cooperatives, and Proudhon\'s “Property is theft.”',
 'Fourier saw that competition ends in monopoly, “feudalism in an inverse order, founded on mercantile leagues” (p. 176).',
 'Mill\'s Principles, 1848, is “the last great effort to retain both the utility and labor perspectives within the same body of economic doctrines” (p. 175).',
 'Bastiat\'s Economic Harmonies, 1850, is “pure economic utilitarianism pushed to its logical conclusions” (p. 175).']);

// ===== BASTIAT =====
txt('Frédéric Bastiat, 1801–1850: who he was','A provincial landowner who became France\'s best economic pamphleteer',[
 'Born in Bayonne, orphaned young, and left to run the family estate at Mugron in the southwest, where he read economics for twenty years.',
 'He began publishing in 1844 after following Cobden\'s Anti-Corn Law League, wrote for the Journal des économistes, and founded a French free-trade association.',
 'Economic Sophisms, 1845–48, made him famous: the candlemakers petitioning against the sun, and the broken window of “what is seen and what is not seen.”',
 'Elected to the Assembly in 1848, he wrote Economic Harmonies against the socialists and died of tuberculosis in Rome in December 1850.']);

txt('The Bastiat you may already know','Two sophisms not in HL',[
 'The candlemakers petition the Chamber to shut out the sun, a competitor who sells light for nothing.',
 'In the broken window, the glazier\'s trade is what is seen and the shoes the shopkeeper would have bought are what is not seen.',
 'Both are opportunity-cost arguments, since the policy that helps one trade is paid for by everyone else.',
 'In the Harmonies he never asks this same question about property, and never asks who pays for it.']);

txt('Bastiat calls economics a science and then appeals to Providence','HL p. 177',[
 '“Socialism, like astrology and alchemy, proceeds by way of imagination; political economy, like astronomy and chemistry, proceeds by way of observation.”',
 'He counts Say and Senior as the scientists and Proudhon as the astrologer.',
 '“It would be absurd for an atheist to say: Laissez faire! ... But we, who are believers have the right to cry: Laissez passer! Let God\'s order and justice prevail.”',
 'Wherever Bastiat\'s evidence runs out he appeals to Providence, and HL say those are the places where his class bias shows (p. 177).']);

scene('Bastiat reduces utilitarian economics to a three-line syllogism','HL p. 178',5,(g,k)=>{
  const L=[['1','All exchanges are mutually beneficial to all parties.'],['2','All human interactions can be reduced to exchanges.'],['∴','All human interactions are beneficial to all parties.']];
  L.slice(0,Math.min(k+1,3)).forEach(([n,t],i)=>{el('rect',{x:120,y:215+i*100,width:1360,height:76,rx:10,fill:i===2?C.gold:C.mist},g);T(g,160,263+i*100,n,{'font-size':34,'font-weight':700,fill:i===2?C.ink:C.green});T(g,230,263+i*100,t,{'font-size':28,fill:C.ink});});
  if(k>=3)bullets(g,['Premise 1 needs the initial distribution taken as given: Condillac, quoted with approval, “every exchange represents two gains for humanity.”','Smith never adopted premise 2 and Ricardo rejected it: “Exchange is political economy ... it is society itself.”'],560,25,Math.min(k-2,2));
  if(k>=4)note(g,'Smith gave exchange a few dozen of a thousand pages, and Ricardo defined the subject as distribution among three classes (HL p. 178). With Bastiat the invisible hand “had become the whole of political economy. The sanitizing job was complete.”',760);
  sweep();});

scene('Premise 1 is true of the trade and silent on the start','Gains from exchange are real, but the endowments were set before the trade',5,(g,k)=>{
  const X=120,Y=230;
  if(k>=0){T(g,X,Y+20,'A buyer values a coat at 10; a seller made it for 4.',{'font-size':26,fill:C.ink});}
  if(k>=1){el('line',{x1:X,y1:Y+90,x2:X+1200,y2:Y+90,stroke:C.ink,'stroke-width':2},g);[0,4,7,10].forEach(v=>{const x=X+v*120;el('line',{x1:x,y1:Y+80,x2:x,y2:Y+100,stroke:C.ink,'stroke-width':2},g);T(g,x,Y+130,String(v),{'text-anchor':'middle','font-size':22,fill:C.warm});});
    el('rect',{x:X+4*120,y:Y+50,width:3*120,height:30,fill:C.earth},g);T(g,X+5.5*120,Y+72,'seller gains 3',{'text-anchor':'middle','font-size':18,fill:C.cream});el('rect',{x:X+7*120,y:Y+50,width:3*120,height:30,fill:C.green},g);T(g,X+8.5*120,Y+72,'buyer gains 3',{'text-anchor':'middle','font-size':18,fill:C.cream});T(g,X+7*120,Y+40,'price 7',{'text-anchor':'middle','font-size':20,'font-weight':700,fill:C.brick});}
  bullets(g,['At any price between 4 and 10 both gain, and the total gain is 6 whatever the price, so premise 1 holds for the trade itself.','The exchange itself does not fix the price, so bargaining decides who gets how much of the 6.','Whether the buyer has 10 to spend, and whether the seller owns the cloth, were settled before the exchange began.','So the syllogism shows that trading from a given starting point helps both traders, but it says nothing about how the starting point was set.'],430,25,Math.min(k,4));
  sweep();});

txt('Onerous utility is priced, but interest takes no effort','HL pp. 179–181',[
 'Gratuitous utility comes from Providence at no cost, water; onerous utility “insists on being purchased through effort,” diamonds, and only the second is priced.',
 'A service is “effort on the part of one man, whereas the want and the satisfaction are another\'s,” so every price pays for pain.',
 'Then money “rendered an important service” by easing exchange, so its owner collects interest even though no effort was expended (p. 180).',
 'HL\'s rule is that “a thinker\'s inconsistencies are often the most fruitful indication of the thinker\'s class bias” (p. 180).',
 '> Value runs “from the service to the material value,” the reverse of what the marginalists will say.',
 '> He never says how utility fixes the value of a service; that theory waited until the 1870s, “after Marx.”']);

txt('Property before law','HL pp. 181–182',[
 '“Property does not exist because there are laws, but laws exist because there is property.”',
 '“Man is born a proprietor ... property is nothing but an extension of the faculties ... divinely instituted.”',
 'To men of property he says all they hold “has been compensation for mental and physical effort, for sweat and toil expended” (p. 182).',
 'HL answer with Hodgskin\'s question (p. 181), why the men who use the tools do not own them if tools extend a man\'s faculties.']);

scene('His distribution law needs r to fall faster than K grows','HL p. 185: “As capital increases, the capitalists\' absolute share increases while their relative share decreases”',5,(g,k)=>{
  const rows=[['capital K','100','300'],['rate of profit r','10%','8%'],['profit rK','10','24'],['output Y','200','300'],['capital\'s share rK ÷ Y','5%','8%']];
  tbl(g,{x:200,y:215,heads:['','year 1','year 2'],rows:rows.slice(0,Math.min(k+1,5)),colW:[480,300,300],fs:27,rowH:62,hl:k>=4?[4]:[],bold:(i,j)=>i===4,color:(i,j)=>i===4&&j>0?C.brick:null});
  if(k>=4)bullets(g,['His whole proof is that “the more plentiful capital is, the lower its interest rate,” and the rate did fall.','The share rose anyway, because capital tripled while the rate fell by a fifth.','His claim requires r to fall faster than K grows, which he never shows.','Piketty\'s r > g is this law tested over two centuries, and the share has gone both ways.'],600,25,4);
  sweep();});

txt('Bastiat never asks why governments create monopolies','HL p. 184',[
 'The state should keep to “the maintenance of liberty, property, and individual rights,” since government is the main source of barriers to competition.',
 'He never asks why governments create monopolies, though his own theory answers that a monopoly is more profitable.',
 '> A bribe for legislation is itself an exchange with two gains.',
 '> So it will be bought, and the public, who did not consent, pays.',
 'Premise 2 fails here, because that exchange has a third party.',
 '“Men\'s interests are harmonious; therefore, the answer lies entirely in this one word: freedom” (p. 185).']);

// plot reminder 1
scene('Where we are after Bastiat','The question of the course has not changed',4,(g,k)=>{plotmap(g,k,['bas'],[
 'Bastiat finished the exchange line, with every exchange two gains and property prior to law, so the market is harmony and the state should guard it.',
 'The question since Smith is the same one: does the market harmonize interests, or does it hide a conflict over who gets the product?',
 'Mill is next, and he takes from both lines.']);sweep();});

// ===== MILL =====
txt('John Stuart Mill, 1806–1873: who he was','The most educated child in England, and the one classical who changed his mind in print',[
 'His father James Mill, Bentham\'s lieutenant, taught him Greek at three, Latin at eight, and political economy at thirteen.',
 'After a breakdown at twenty he spent thirty-five years at the East India Company and wrote the System of Logic, 1843, and the Principles, 1848.',
 'Harriet Taylor, whom he married in 1851, pushed each edition of the Principles leftward, and On Liberty followed in 1859.',
 'A member of Parliament, 1865–68, who proposed votes for women; he died in Avignon in 1873, having recanted his own wages fund in 1869.']);

txt('Production laws are physical; distribution laws are chosen','HL p. 186',[
 '“The production of wealth ... is evidently not an arbitrary thing. It has necessary conditions.”',
 '“Unlike the laws of Production, those of Distribution are partly of human institution.”',
 'For Mill property is “wholly a question of general expediency,” and “when private property [is] not expedient, it [is] unjust.”',
 '“Exchange is not the fundamental law of the distribution of produce, no more than roads and carriages are the essential laws of motion” (p. 187).']);

scene('Can distribution be read off production?','Y = K^(1/3) L^(2/3); K = 8, L = 27, so Y = 18',6,(g,k)=>{
  const rows=[['marginal product of capital','(1/3)·Y/K = 0.75','pays capital 0.75 × 8 = 6'],['marginal product of labor','(2/3)·Y/L = 0.44','pays labor 0.44 × 27 = 12'],['sum','6 + 12 = 18 = Y','the product is exactly used up (Euler)']];
  tbl(g,{x:120,y:215,heads:['Say, Clark: pay each factor its marginal product','','so'],rows:rows.slice(0,Math.min(k+1,3)),colW:[480,360,560],fs:24,rowH:62,bold:(i,j)=>i===2});
  if(k>=3)bullets(g,['Under constant returns the production function alone fixes the split at one third to capital and two thirds to labor, so distribution is derived from production.','Mill\'s view is that the same 18 can be split 6 and 12, or 2 and 16, or 9 and 9 without violating the production function.','So the split is set by property and bargaining.','The dispute is whether F(K, L) determines who gets paid.'],500,25,Math.min(k-2,4));
  sweep();});

txt('Mill rejects both of Bentham\'s axioms','HL p. 187',[
 'Bentham\'s axioms: all motives are self-interest, and each person is the sole judge of his own pleasures, so “pushpin is as good as poetry.”',
 'Mill: people act from self-interest because a competitive society made them so, and a better society might act from “nobler” motives.',
 'And “some kinds of pleasure are more desirable and more valuable than others”: “better to be a Socrates dissatisfied than a fool satisfied.”',
 'HL say that sentence “utterly destroys the basis” of every normative argument from exchange, because someone other than the chooser can now judge the choice.']);

txt('Mill opens with Ricardo and ends with Smith\'s price','HL pp. 188–190',[
 'He opens with Ricardo: cost “is resolvable into labour,” and value “depends principally (we shall presently see whether it depends solely) on the quantity of labour.”',
 'Then wine and cloth, equal labor and different timing, and “all commodities made by machinery are assimilated to the wine.”',
 '> That is the Level 3 problem from the game.',
 '> Ricardo called it small, and Mill does not.',
 'So he reverts to Smith\'s adding-up price: natural price = the price of land + the price of labor + the price of capital.',
 'Value means exchange value only; he dismisses Ricardo\'s invariable measure as impossible and beside the point.']);

scene('Two theories of profit, nine pages apart in one book','HL p. 189',5,(g,k)=>{
  cols2(g,k,{hl:'profit as a residual (Ricardo)',hr:'profit as a price (Smith, Senior)',xl:100,xm:300,xr:900,mcl:46,mcr:46,fs:21,rows:[
   ['the sentence','“The cause of profit is, that labour produces more than is required for its support.”','“the profits of the capitalist are properly, according to Mr. Senior\'s well-chosen expression, the remuneration of abstinence”'],
   ['where it comes from','“not from the incident of exchange, but from the productive power of labour”','exchange: a payment for abstinence, risk, and superintendence, with a minimum rate below which capital stops'],
   ['the corn model','100 hours, 70 to the basket, 30 is what is left','price = w + r·K + rent, each a price of a service'],
   ['test: wages rise','profit falls, and the capital-heavy good gets cheaper (Tables 5.1–5.2)','every price rises, as Smith said and Ricardo refuted']]});
  if(k>=4)note(g,'HL say the second view “dominated Mill\'s Principles,” and the numbers come out the same either way, 70 and 30. The difference is whether the 30 is a deduction from what labor produced or a payment for abstinence.',740);
  sweep();});

scene('Mill held the wages fund in 1848 and gave it up in 1869','HL pp. 191–192',5,(g,k)=>{
  const rows=[['1848, the Principles','w = F ÷ N: “the demand for labour is constituted solely by the funds directly set apart for the use of labourers”','700 ÷ 10 = 70, and a strike cannot change F'],['1869, the Thornton review','the fund is what profit leaves after the capitalists\' own maintenance, and the wage is set by struggle: “the additional payment comes out of his own income”','w = w₀ + β(Y − w₀ − c): Y 100, w₀ 50, c 20'],['weak unions, β = 0.5','','wages 65, profit 35'],['strong unions, β = 0.8','','wages 74, profit 26']];

  sweep();});

scene('Mill describes periodic crises and still defends Say\'s Law','HL pp. 192–193',7,(g,k)=>{
  const rows=[['1  calm','100','10%','accumulate'],['2  accumulation','150','6.7%','profit sinks toward the minimum'],['3  over-trading','200','5%','“factories are built ... beyond what the market requires”'],['4  crisis','140','7.1%','“establishments are shut up ... hands are discharged”; capital destroyed'],['5  recovery','150','6.7%','and “such revulsions are almost periodical”']];

  sweep();});

  rbul(g,['Ricardo showed both countries gain at any price between the two cost ratios, but he never said which price.','Factors do not cross borders, so costs are not equalized and the international price “depend[s] exclusively on supply and demand.”','Each country must pay for imports with exports, so at every price it offers a quantity of cloth for wine: an offer curve.','The price is where the two curves cross, where “the whole of her exports may exactly pay for the whole of her imports,” which Mill called reciprocal demand.'],800,270,21,46,Math.min(k+1,4));
  sweep();});

txt('Mill prefers communism to the present distribution, but not yet','HL pp. 194–195',[
 '“I do not recognize as either just or salutary, a state of society in which there is any ‘class’ which is not labouring.”',
 'If the choice were Communism or the present distribution, “all the difficulties, great or small, of Communism would be but as dust in the balance.”',
 'But socialism is “at present workable only by the elite of mankind,” and “while minds are coarse they require coarse stimuli, and let them have them.”',
 'So the task “for a considerable time to come” is “not the subversion of the system of individual property, but the improvement of it.”']);

scene('Mill departs from laissez faire five times in two pages','HL pp. 195–198',5,(g,k)=>{

  sweep();});

scene('Four accounts of how property began','Someone owns the land and the loom. How did that happen?',6,(g,k)=>{

  sweep();});

txt('Bastiat defends unlimited bequest and Mill would cap it','HL p. 183 beside p. 197',[
 'Bastiat: forbidding bequest “would prevent the creation of new private property by paralyzing a full half of human effort,” because a father works for his children.',
 '> So Bastiat defends bequest on the grounds of a father\'s love for his children, and casts the socialists as the enemies of that love.',
 '> Thompson had argued the reverse: only a cooperative society secures all children, not the lucky ones.',
 'Mill would cap “the amount which any person should be permitted to acquire by gift, bequest, or inheritance” (p. 197).',

  if(k>=5)note(g,'This is the no-rent margin from Ricardo\'s Farm seen from the owner\'s side, where the right exists because the rent it creates exceeds the cost of enforcing it. It is the efficiency account of property, and modern law and economics begins from it (Coase 1960, Alchian and Demsetz 1972).',620);

txt('What to remember','',[
 'Bastiat argues that every exchange is two gains and all of life is exchange, so property is sacred and freedom is the only policy.',
 '> The argument takes the endowments as given.',
 '> It ignores third parties.',
 'Mill holds that production has laws while distribution is chosen, and his program is to improve private property rather than abolish it.',
 'How property originated decides whether the owner\'s income is a payment or a deduction, which is the divide between the two theories of value.',
 'Next is Marx, who keeps the labor theory, the conquest account of property, and Mill\'s theory of crises, and rejects reform.']);

// ---------------- engine ----------------
let i=0,k=0;
const stagesOf=n=>S[n].stages||1;
function show(si,sk){
  i=Math.max(0,Math.min(S.length-1,si));
  const s=S[i];k=Math.max(0,Math.min(stagesOf(i)-1,sk||0));
  $('title').textContent=s.title;$('sub').textContent=s.sub||'';
  const g=$('body');while(g.firstChild)g.removeChild(g.firstChild);
  if(!s.stages)bars={};
  s.draw(g,k);
  $('counter').textContent=(i+1)+' / '+S.length+(stagesOf(i)>1?'   ·   step '+(k+1)+' of '+stagesOf(i)+(k<stagesOf(i)-1?'  →':''):'');
  try{localStorage.setItem('bm.i',i);localStorage.setItem('bm.k',k);}catch(e){}
}
const next=()=>{if(k<stagesOf(i)-1)show(i,k+1);else show(i+1,0);};
const prev=()=>{if(k>0)show(i,k-1);else if(i>0)show(i-1,stagesOf(i-1)-1);};
document.body.addEventListener('click',e=>{if(e.shiftKey)prev();else next();});
window.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next();}else if(['ArrowLeft','ArrowUp','PageUp','Backspace','p','P'].includes(e.key)){e.preventDefault();prev();}else if(e.key==='End'||e.key==='.'){show(i,stagesOf(i)-1);}else if(e.key==='n'||e.key==='N'){show(i+1,0);}else if(e.key==='r'||e.key==='R'){show(0,0);}else if(e.key==='f'||e.key==='F'){const d=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else{(d.requestFullscreen||d.webkitRequestFullscreen).call(d);}}});
let si=0,sk=0;try{si=+localStorage.getItem('bm.i')||0;sk=+localStorage.getItem('bm.k')||0;}catch(e){}
const Q=new URLSearchParams(location.search);if(Q.has('s')){si=(+Q.get('s')||1)-1;sk=Q.has('k')?(+Q.get('k')||1)-1:99;}
show(si,sk);
})();
